; Holosong - an in-game music widget for Fallout 4 (Old-gen, Next-gen and Anniversary)
; Everything here can also be changed in game: press Page Up for the cursor, then the gear on the widget.
; Changes made in game are saved back to this file by themselves.
;
; Keys are Windows virtual-key codes. 0 = no key.
; F1-F12 = 112-123 (F5 quicksave and F9 quickload are taken), Insert 45, Home 36, Page Up 33, Page Down 34,
; End 35, Delete 46, letters A-Z = 65-90, numbers 0-9 = 48-57, numpad 0-9 = 96-105.

[General]
; Shows or hides the widget. 34 = Page Down
iToggleKey=34
; Cursor mode: a cursor to click, drag and resize the widget. While it's on, the game and other mods
; get no keys or clicks (no shooting, no other mods' hotkeys firing). Esc or the same key puts the cursor away. 33 = Page Up
iCursorKey=33
; Opens the widget's settings window (the cursor comes up with it); press again to close it. 0 = no key
; (the gear on the widget and on the bar under it in cursor mode opens them too). 121 = F10, 36 = Home
iSettingsKey=0
; 0 = press the cursor key once for the cursor and again to put it away, 1 = the cursor is there while you hold the key
bCursorHold=0
; 1 = the widget is showing (the show/hide key and the widget's close button change this)
bVisible=1
; Cursor speed in cursor mode (0.1 - 10)
fMouseSpeed=1.0
; Size of the settings window (0.6 - 2.0)
fUIScale=1.0

[Widget]
; Top-left corner as a fraction of the screen (0 = left/top edge, 1 = right/bottom edge).
; Fractions keep the widget in the same spot when you change resolution.
fPosX=0.70
fPosY=0.06
; Size at 1080p and 100% scale (width 240-1000, height 84-680). The layout follows the shape:
; about twice as wide as tall or more = horizontal bar, clearly taller than wide = portrait, otherwise standard.
fWidth=340
fHeight=380
; Scale of everything in the widget, in percent (50 - 100). Ctrl + mouse wheel over the widget in cursor mode works too.
iScale=100
; Background opacity in percent (30 - 100)
iOpacity=95
; Opacity of the album cover, the buttons, the progress bar and the sliders in percent (10 - 100).
; Text never fades, so the song and times stay readable.
iCoverButtonsOpacity=100
; Parts of the widget (shown when there's room for them). Outside cursor mode the settings/close buttons and the
; volume + music mute section are hidden and the widget is that much shorter.
bShowTitleBar=1
bShowAlbumArt=1
bShowProgress=1
bShowSound=1
; 1 = nothing can move or resize the widget, even in cursor mode
bLocked=0

[Look]
; Holosong draws itself in one colour, like the Pip-Boy's screen:
; 1 = the game's HUD colour, 2 = the game's Pip-Boy colour (both: what you picked in Settings > Display -
;     a change there shows right away), 3 = custom (below), 0 = the original gold look (Hearthsong's Modern style)
iColorMode=1
; Custom colour (0 - 255 each), used with iColorMode=3. Always shown at full brightness so it stays readable.
iCustomRed=20
iCustomGreen=255
iCustomBlue=23
; 1 = the album cover is shown in the colour too (like a picture on the Pip-Boy), 0 = the cover keeps its own colours
bTintAlbumArt=1

[Safety]
; 1 = when combat starts while the cursor is up, the cursor goes away and you get the camera and your weapon back
bLeaveCursorInCombat=1
; 1 = the cursor key does nothing during combat
bNoCursorInCombat=1
; The widget only moves or resizes after the mouse button has been held this long (milliseconds)...
iDragDelayMs=150
; ...AND the mouse has moved this far (pixels). A quick click never nudges it.
; Drag anywhere on the widget to move it (not on a button or slider), drag an edge or corner to resize it.
iDragDistance=6

[Hiding]
; 1 = the widget fades out when combat starts and comes back afterwards
bAutoHideInCombat=0
; Seconds after the fight ends before it comes back
fShowAgainAfter=2.0
; 1 = hidden while the game is paused or a menu is open (Pip-Boy, terminals, containers, workshop...)
bHideInMenus=1
; 1 = hidden while Spotify isn't open (otherwise it shows an "Open Spotify" button)
bHideWhenNoPlayer=0

[Keys]
; In cursor mode, Ctrl + this key undoes the last move or resize (90 = Z)
iUndoKey=90
; These work any time you're playing, without the cursor. Your keyboard's media keys work too.
iPlayPauseKey=0
iNextKey=0
iPreviousKey=0
iVolumeUpKey=0
iVolumeDownKey=0

[Sound]
; 1 = Fallout 4's music goes silent while Spotify plays, and comes back when it stops.
; It's back to normal while the pause menu is open, so your audio settings are saved as they are.
bMuteGameMusic=1
; 1 = the radio (Diamond City Radio and the other Pip-Boy stations) goes silent too
bMuteRadio=0
; Volume keys and mouse wheel over the volume slider: step in percent
iVolumeStep=5
; Which app to control: part of its name as Windows knows it. Spotify by default; other players work too
; (foobar2000 = foobar, MusicBee, a browser tab = chrome / msedge / firefox).
; Settings > Sound lists every app Windows sees right now, and Holosong.log names them too.
; Spotify missing from that list? Play a song in it, and in Spotify turn on
; Settings > Display > "Show desktop overlay when using media keys", then restart Spotify.
sMusicApp=Spotify
; 1 = if that app isn't running, control whatever Windows says is playing
bAnyPlayer=0

[Debug]
; Troubleshooting switches. Leave them at 1 normally.
; 1 = draw the widget (hooks the game's rendering)
bHookPresent=1
; 1 = listen to the keyboard and mouse (needed for every key)
bInputSink=1
; 1 = in cursor mode, the game and other mods get no key presses, clicks or mouse movement.
; 0 = the game keeps getting everything (you'd shoot when you click the widget)
bBlockInput=1
bLogInput=0
; 1 = keys and mouse come from Windows' low-level hooks, which see them before the game does (works whatever way
; the game reads input). 0 = only from DirectInput, inside the game.
bLowLevelHooks=1
; 1 = top-left corner shows the game's frame rate and how long Holosong takes of each frame (also in Settings > Behaviour)
bShowFps=0
